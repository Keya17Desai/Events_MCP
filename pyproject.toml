[project]
name = "events-mcp"
version = "0.1.0"
description = "MCP server for live event discovery and booking simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "cachetools>=7.0.6",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.0",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "tinydb>=4.8.2",
]

[project.scripts]
events-mcp = "events_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
