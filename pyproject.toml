[project]
name = "events-mcp"
version = "0.1.0"
description = "MCP server for live event discovery and booking simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27.0",
]

[project.scripts]
events-mcp = "events_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
